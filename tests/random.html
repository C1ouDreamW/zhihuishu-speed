<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>随机性验证</title></head>
<body>
<div id="out">…</div>
<script>
  // 直接验证脚本里用到的随机函数是否符合预期：
  // 模拟同一段逻辑，检查延迟是否在区间内、是否有抖动、是否存在重复
  var lines = [];

  function randMs(minSec, maxSec) {
    var s = minSec + Math.random() * (maxSec - minSec);
    return Math.round(s * 1000);
  }
  function jitter(ms, ratio) {
    ratio = ratio == null ? 0.22 : ratio;
    return Math.round(ms * (1 + (Math.random() * 2 - 1) * ratio));
  }

  // 1. 区间检查 + 抖动范围
  var min = 3, max = 12;
  var vals = [], oob = 0, minSeen = Infinity, maxSeen = -Infinity;
  for (var i = 0; i < 2000; i++) {
    var d = jitter(randMs(min, max), 0.3);
    vals.push(d);
    if (d < min * 1000 * 0.7 || d > max * 1000 * 1.3) oob++;
    if (d < minSeen) minSeen = d;
    if (d > maxSeen) maxSeen = d;
  }
  lines.push('抖动后范围: ' + (minSeen / 1000).toFixed(2) + 's ~ ' + (maxSeen / 1000).toFixed(2) + 's');
  lines.push('超出 [min*0.7, max*1.3] 的样本: ' + oob + ' / 2000 ' + (oob === 0 ? 'OK' : 'FAIL'));

  // 2. 重复率：连续两次延迟完全相同的概率应极低
  var dup = 0;
  for (var j = 1; j < vals.length; j++) if (vals[j] === vals[j - 1]) dup++;
  lines.push('相邻重复次数: ' + dup + ' / 1999 ' + (dup < 20 ? 'OK' : 'FAIL'));

  // 3. 分布检查：抖动后是"钟形+平台"混合，用分位数判断而非等分三段
  vals.sort(function (a, b) { return a - b; });
  function q(p) { return vals[Math.floor(vals.length * p)]; }
  var p10 = q(0.10) / 1000, p50 = q(0.50) / 1000, p90 = q(0.90) / 1000;
  lines.push('分位数: p10=' + p10.toFixed(2) + 's  p50=' + p50.toFixed(2) + 's  p90=' + p90.toFixed(2) + 's');
  // 中位数应落在配置区间中部附近；p10/p90 应明显分开（有离散度）
  var midOk = p50 > min * 0.85 && p50 < max * 1.05;
  var spreadOk = (p90 - p10) > (max - min) * 0.5;
  lines.push('中位数落在合理区间: ' + (midOk ? 'OK' : 'FAIL'));
  lines.push('离散度充足: ' + (spreadOk ? 'OK' : 'FAIL'));

  // 4. 唯一值数量（离散度）
  var uniq = {};
  vals.forEach(function (v) { uniq[v] = 1; });
  var uniqCount = Object.keys(uniq).length;
  lines.push('唯一延迟值: ' + uniqCount + ' 种 ' + (uniqCount > 500 ? 'OK' : 'FAIL'));

  var pass = oob === 0 && dup < 20 && midOk && spreadOk && uniqCount > 500;
  document.getElementById('out').textContent = lines.join('\n') + '\n\n' + (pass ? 'PASS' : 'FAIL');
  document.title = pass ? 'RESULT:PASS' : 'RESULT:FAIL';
</script>
</body></html>
